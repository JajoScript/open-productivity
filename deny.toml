[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# MPL-2.0 is GPLv3-compatible (via dirs); allowed per crate, not globally.
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

# Every crate comes from crates.io; a dependency pulled from elsewhere fails the check.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
unmaintained = "workspace"
